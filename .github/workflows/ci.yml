name: CI (build and test)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONPATH: ${{ github.workspace }}/python
      COVERAGE_PROCESS_START: ${{ github.workspace }}/.coveragerc
      MPLBACKEND: Agg
      FEELMRI_FAST_TEST: "1"

    steps:
      # ------------------------------------------------------------
      # Checkout the repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Set up Python environment (with pip caching)
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      # ------------------------------------------------------------
      # Cache build and compiled objects
      # ------------------------------------------------------------
      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.ccache
            build/
          key: build-${{ runner.os }}-${{ hashFiles('setup.cfg', 'pyproject.toml', '**/CMakeLists.txt') }}
          restore-keys: |
            build-${{ runner.os }}-

      # ------------------------------------------------------------
      # Install system dependencies (including MPI)
      # ------------------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            python3 \
            python3-dev \
            python3-pip \
            python3-tk \
            cmake \
            ninja-build \
            git \
            libopenmpi-dev \
            ccache \
            p7zip-full
          sudo apt-get clean

      # ------------------------------------------------------------
      # Install FEelMRI and Python dependencies
      # ------------------------------------------------------------
      - name: Install system dependencies for FEniCS Basix
        run: sudo apt-get update && sudo apt-get install -y libblas-dev liblapack-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/hmella/pyevtk.git
          pip install -e .[dev] pytest pytest-cov pytest-timeout coverage codecov

      # ------------------------------------------------------------
      # Verify MPI installation
      # ------------------------------------------------------------
      - name: Verify MPI
        run: |
          mpirun --version
          which mpirun

      # ------------------------------------------------------------
      # Unzip phantom files
      # ------------------------------------------------------------
      - name: Unzip phantom files
        run: |
          echo "Unzipping phantom files..."
          7z x examples/phantoms/phantoms_compressed.zip -oexamples/phantoms/

      # ------------------------------------------------------------
      # Enable coverage collection in subprocesses (mpirun, examples)
      # ------------------------------------------------------------
      - name: Enable subprocess coverage
        run: |
          python -c "import sysconfig, pathlib; \
          pathlib.Path(sysconfig.get_paths()['purelib'], 'coverage_subprocess.pth').write_text('import coverage; coverage.process_startup()\n')"

      # ------------------------------------------------------------
      # Run the full test suite with coverage
      # ------------------------------------------------------------
      - name: Run tests with coverage
        run: |
          coverage erase
          # 'pulseq' marker excludes tests that depend on the optional
          # 'pypulseq' package. They run in the separate pulseq-tests job
          # below, once per supported pypulseq version. Register and apply
          # the marker as documented in tests/conftest.py.
          coverage run --rcfile=.coveragerc -m pytest tests/ -m "not pulseq"

      # ------------------------------------------------------------
      # Combine coverage and generate XML
      # ------------------------------------------------------------
      - name: Combine coverage and generate XML
        run: |
          echo "Combining all coverage files..."
          coverage combine
          
          echo "Generating XML and HTML reports..."
          coverage xml -o coverage.xml
          coverage html
          
          echo "Checking coverage threshold..."
          coverage report
      # coverage report -m --fail-under=50

      # ------------------------------------------------------------
      # Upload HTML coverage report as artifact
      # ------------------------------------------------------------
      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov

      # ------------------------------------------------------------
      # Upload coverage results to Codecov (for badge)
      # ------------------------------------------------------------
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: feelmri
          fail_ci_if_error: true

  # ------------------------------------------------------------
  # The optional Pulseq adapter, once per supported pypulseq.
  #
  # pypulseq reads only up to its own .seq format version, and the v1.5
  # layout is not backward readable, so the v1.5 fixtures skip themselves
  # under 1.4 (tests/conftest.py::skip_if_pypulseq_too_old). Both versions
  # must stay green: the declared range is >=1.2,<1.6.
  # ------------------------------------------------------------
  pulseq-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        pypulseq: ["1.4.2.post1", "1.5.0.post1"]

    env:
      PYTHONPATH: ${{ github.workspace }}/python
      MPLBACKEND: Agg
      FEELMRI_FAST_TEST: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            build/
          key: pulseq-${{ runner.os }}-${{ matrix.pypulseq }}-${{ hashFiles('setup.cfg', 'pyproject.toml', '**/CMakeLists.txt') }}
          restore-keys: |
            pulseq-${{ runner.os }}-${{ matrix.pypulseq }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3-dev cmake ninja-build git \
            libopenmpi-dev libblas-dev liblapack-dev
          sudo apt-get clean

      - name: Install FEelMRI with the pulseq extra
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/hmella/pyevtk.git
          pip install -e .[dev,pulseq] pytest pytest-timeout
          pip install "pypulseq==${{ matrix.pypulseq }}"

      - name: Report the versions under test
        run: |
          python -c "import pypulseq; print('pypulseq', pypulseq.__version__)"

      - name: Run the Pulseq test suite
        run: pytest tests/ -m "pulseq" -v
